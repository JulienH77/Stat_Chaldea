name: Sync cloud snapshot

on:
  schedule:
    # Chaque dimanche à 04:30 UTC.
    - cron: '30 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build initial-state snapshot
        run: node tools/sync-initial-state.mjs

      - name: Commit snapshot when changed
        run: |
          if git diff --quiet -- data/initial-state.json; then
            echo 'Aucune modification dans le snapshot.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/initial-state.json
          git commit -m 'chore: update Supabase roster snapshot'
          git push
